packages:
  - 'packages/*'
  - 'apps/*'

# The tree-sitter grammar packages ship a native Node binding built by a
# postinstall script. The editor does not use that binding — it loads each
# package's prebuilt WebAssembly grammar instead — so the builds are off.
allowBuilds:
  tree-sitter-javascript: false
  tree-sitter-html: false
  tree-sitter-python: false
  tree-sitter-json: false
  tree-sitter-css: false
  tree-sitter-typescript: false
  tree-sitter-rust: false
  tree-sitter-go: false
  tree-sitter-bash: false
  tree-sitter-php: false
  '@tree-sitter-grammars/tree-sitter-markdown': false
  # tree-sitter CLI: postinstall downloads the prebuilt platform binary,
  # which we *do* want — `scripts/build-grammars.sh` shells out to it to
  # produce the vendored markdown wasm files. Unlike the grammar
  # packages, no native gyp build runs here.
  tree-sitter-cli: true
  '@6cdh/tree-sitter-scheme': false
  '@derekstride/tree-sitter-sql': false
  '@pfoerster/tree-sitter-latex': false
  '@tree-sitter-grammars/tree-sitter-lua': false
  '@tree-sitter-grammars/tree-sitter-toml': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  tree-sitter-c: false
  tree-sitter-c-sharp: false
  tree-sitter-clojure: false
  tree-sitter-cpp: false
  tree-sitter-elixir: false
  tree-sitter-graphql: false
  tree-sitter-haskell: false
  tree-sitter-java: false
  tree-sitter-kotlin: false
  tree-sitter-nix: false
  tree-sitter-ocaml: false
  tree-sitter-ruby: false
  tree-sitter-swift: false
  tree-sitter-xml: false
  tree-sitter-zig: false
  tree-sitter-make: false
  tree-sitter-perl: false
  # citation-js ships no native postinstall we need; the editor uses the
  # bundled ESM build, so the ignored-build placeholder must resolve to a
  # boolean or `pnpm install` aborts on a fresh clone.
  citation-js: false
  esbuild: true
