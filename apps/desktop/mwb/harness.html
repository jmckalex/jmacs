<!doctype html>
<!--
  Model-B Phase-0 spike — the CLIENT harness page.

  A deliberately minimal text view: it renders a buffer from a LOCAL
  STRING MIRROR (plan §4 "replicated client"), echoes self-insert locally
  and immediately (local echo), sends the intent up to the Lisp server
  over a MessagePort, and reconciles the server's authoritative delta when
  it returns. It instruments two latencies with performance.now():

    1. local-echo  : keydown -> mirror updated -> painted  (should be ~0)
    2. round-trip  : keydown -> server delta back -> reconciled  (THE number)

  It does NOT use the real view.js (that is the "largest single refactor"
  the plan warns against, and out of scope for a latency spike). The point
  is to measure the protocol, not to re-render the editor.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Model B Phase 0 — latency spike</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, sans-serif;
        background: #1b1b23;
        color: #d8dee9;
      }
      header {
        padding: 10px 16px;
        background: #232531;
        border-bottom: 1px solid #333;
        font-size: 13px;
      }
      header b { color: #88c0d0; }
      #editor {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 15px;
        line-height: 1.5;
        padding: 16px;
        white-space: pre-wrap;
        outline: none;
        min-height: 200px;
        caret-color: #88c0d0;
      }
      #editor:focus { background: #1e2029; }
      .cursor {
        display: inline-block;
        width: 2px;
        margin: 0 -1px;
        background: #88c0d0;
        animation: blink 1s steps(1) infinite;
        vertical-align: text-bottom;
        height: 1.2em;
      }
      @keyframes blink { 50% { opacity: 0; } }
      #stats {
        padding: 12px 16px;
        background: #232531;
        border-top: 1px solid #333;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        white-space: pre;
      }
      .controls { padding: 8px 16px; font-size: 12px; }
      .controls button {
        background: #3b4252; color: #d8dee9; border: 1px solid #4c566a;
        border-radius: 4px; padding: 4px 10px; margin-right: 8px; cursor: pointer;
      }
      .controls label { margin-right: 12px; }
      .warn { color: #ebcb8b; }
      .good { color: #a3be8c; }
    </style>
  </head>
  <body>
    <header>
      <b>Model B Phase 0</b> — typing through a central Lisp server in a
      utilityProcess. Click the editor and type. Local echo paints
      instantly; the server confirms over the wire.
      <span id="link" class="warn">connecting to server…</span>
    </header>
    <div class="controls">
      <label
        ><input type="checkbox" id="mode-server" checked /> route through
        server (Model B)</label
      >
      <label
        ><input type="checkbox" id="echo" checked /> local echo</label
      >
      <button id="bench">Run 200-keystroke benchmark</button>
      <button id="reset-stats">Reset stats</button>
    </div>
    <div id="editor" tabindex="0"></div>
    <div id="stats">stats will appear here.</div>
    <script type="module" src="./client.js"></script>
  </body>
</html>
