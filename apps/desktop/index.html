<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; script-src 'self' app: 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: media: https:; media-src 'self' app: media: data: https:; frame-src 'self' app: https:"
    />
    <title>editor</title>
    <!-- Vendor stylesheets first, our own styles.css last so it wins
         the cascade on equal-specificity rules (xterm.css ships a hard
         `.xterm .xterm-viewport { background-color: #000 }` that we
         need to override for the shell view's bottom strip). -->
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css" />
    <!-- xterm.js styles — required for the shell view's terminal grid
         to render (the .xterm-* classes its widget emits all key off
         this sheet). Loaded by relative path through the renderer's
         pnpm-installed copy. -->
    <link
      rel="stylesheet"
      href="../../packages/renderer/node_modules/@xterm/xterm/css/xterm.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@editor/storage": "../../packages/storage/src/index.js",
          "@editor/buffer": "../../packages/buffer/src/index.js",
          "@editor/view": "../../packages/view/src/index.js",
          "@editor/pane": "../../packages/pane/src/index.js",
          "@editor/lisp": "../../packages/lisp/src/index.js",
          "@editor/renderer": "../../packages/renderer/src/index.js",
          "@editor/stdlib": "../../packages/stdlib/src/index.js",
          "@xterm/xterm": "../../packages/renderer/node_modules/@xterm/xterm/lib/xterm.mjs",
          "@xterm/addon-fit": "../../packages/renderer/node_modules/@xterm/addon-fit/lib/addon-fit.mjs"
        }
      }
    </script>

    <!-- MathJax — loaded once for the whole app, so HTML in the view
         (sticky notes today) can carry typeset mathematics. The config
         must precede the library; the library is vendored, see
         vendor/mathjax/. Nothing is typeset until something asks. -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ['$', '$'],
            ['\\(', '\\)'],
          ],
          displayMath: [
            ['$$', '$$'],
            ['\\[', '\\]'],
          ],
        },
        svg: { fontCache: 'local' },
        startup: { typeset: false },
      };
    </script>
    <script src="./vendor/mathjax/tex-svg.js"></script>
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">editor</span>
    </header>

    <div id="workspace" class="workspace">
      <main id="editor-host" class="editor-host"></main>
      <div
        id="preview-splitter"
        class="splitter splitter-horizontal"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize the Markdown preview pane"
      ></div>
      <section id="markdown-preview-host" class="markdown-preview-host"></section>
    </div>

    <div
      id="repl-splitter"
      class="splitter splitter-vertical"
      role="separator"
      aria-orientation="horizontal"
      aria-label="Resize the REPL pane"
    ></div>

    <section id="repl-host" class="repl-host"></section>

    <div id="minibuffer-host"></div>

    <!-- The view warehouse — a hidden container for view elements that
         exist but aren't currently shown in any pane. See
         plans/VIEWS-AS-CUSTOM-ELEMENTS.md (Decision 3). The `hidden`
         attribute removes the subtree from layout, accessibility tree,
         and tab focus; children take zero rendering cost. -->
    <div id="view-warehouse" hidden></div>

    <footer class="modeline">
      <span id="modeline-name" class="modeline-name"></span>
      <span id="modeline-position" class="modeline-position"></span>
    </footer>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
